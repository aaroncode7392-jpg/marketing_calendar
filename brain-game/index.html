<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘의 두뇌 운동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum:wght@400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --cream:#FBF4E6; --paper:#FFFFFF; --ink:#3A2E28; --ink-soft:#7A6A5E; --line:#EAD9BE;
    --speed:#EE7B5B; --memory:#2FA28E; --seq:#E0A33B; --math:#9A6FB0;
    --ok:#3FA796; --warn:#E8635B;
    --shadow:0 8px 0 rgba(0,0,0,0.06),0 14px 30px rgba(120,90,60,0.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Gowun Dodum',sans-serif;min-height:100%;}
  body{background-image:radial-gradient(circle at 20% 0%,#FFFBF2 0%,var(--cream) 60%);}
  #app{max-width:560px;margin:0 auto;padding:20px 18px 60px;min-height:100vh;position:relative;z-index:1;}
  h1,h2,h3,.display{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:.5px;}
  .fade{animation:fade .35s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes pop{0%{transform:scale(.85);}60%{transform:scale(1.06);}100%{transform:scale(1);}}
  @keyframes flashIn{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
  @keyframes cardPop{0%{opacity:0;transform:scale(.4) rotate(-8deg);}60%{transform:scale(1.08) rotate(2deg);}100%{opacity:1;transform:scale(1) rotate(0);}}
  @keyframes zoomFadeIn{0%{opacity:0;transform:scale(.94);}100%{opacity:1;transform:scale(1);}}
  .card-zoom-modal{animation:zoomFadeIn .3s ease both;}
  @keyframes jellyPop{
    0%{transform:scale(.3);opacity:0;}
    15%{opacity:1;}
    40%{transform:scale(1.22,.8);}
    55%{transform:scale(.86,1.16);}
    70%{transform:scale(1.1,.92);}
    83%{transform:scale(.95,1.05);}
    92%{transform:scale(1.03,.98);}
    100%{transform:scale(1,1);opacity:1;}
  }
  @keyframes burstRing{
    0%{transform:scale(0);opacity:.95;}
    60%{opacity:.4;}
    100%{transform:scale(2.8);opacity:0;}
  }
  @keyframes burstOut{
    0%{transform:translate(-50%,-50%) scale(.3) rotate(0deg);opacity:1;}
    100%{transform:translate(calc(-50% + var(--bx)),calc(-50% + var(--by))) scale(1.15) rotate(180deg);opacity:0;}
  }
  .card-fx-wrap{position:relative;display:inline-block;margin:6px 0;}
  .card-burst-ring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;
    border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.9) 0%,rgba(255,168,90,.5) 40%,rgba(255,168,90,0) 70%);
    animation:burstRing .65s ease-out forwards;pointer-events:none;z-index:0;}
  .card-jelly{position:relative;z-index:1;animation:jellyPop .75s cubic-bezier(.34,1.56,.64,1) both;}
  .burst-particle{position:absolute;left:50%;top:50%;pointer-events:none;z-index:2;animation:burstOut .7s ease-out forwards;}
  /* tap / correct-answer flourish (game clicks) */
  @keyframes tapPop{0%{transform:scale(1) rotate(0);}40%{transform:scale(1.24) rotate(-4deg);}70%{transform:scale(.96) rotate(2deg);}100%{transform:scale(1) rotate(0);}}
  .tap-pop{animation:tapPop .38s cubic-bezier(.34,1.56,.64,1);}
  @keyframes miniBurstOut{
    0%{transform:translate(-50%,-50%) scale(.3) rotate(0deg);opacity:1;}
    100%{transform:translate(calc(-50% + var(--bx)),calc(-50% + var(--by))) scale(1.3) rotate(220deg);opacity:0;}
  }
  .mini-burst-particle{position:fixed;left:0;top:0;pointer-events:none;z-index:80;animation:miniBurstOut .75s ease-out forwards;}
  @keyframes textPop{0%{opacity:0;transform:scale(.6);}55%{transform:scale(1.14);}100%{opacity:1;transform:scale(1);}}
  .fx-text{animation:textPop .45s cubic-bezier(.34,1.56,.64,1) both;}
  /* topbar */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .topbar .brand{font-family:'Jua';font-size:26px;color:var(--ink);}
  .iconbtn{background:var(--paper);border:2px solid var(--line);border-radius:16px;width:48px;height:48px;font-size:22px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.06);}
  .iconbtn:active{transform:translateY(2px);box-shadow:none;}
  /* hero */
  .hero{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 6px 16px rgba(0,0,0,.08);margin-bottom:16px;}
  .hero .hello{font-family:'Jua';font-size:28px;line-height:1.3;margin:0 0 6px;}
  .hero .sub{font-size:17px;color:var(--ink-soft);margin:0;line-height:1.5;}
  .streak{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:#FFF3DF;border:none;box-shadow:0 4px 10px rgba(0,0,0,.05);color:#B5772A;border-radius:999px;padding:8px 16px;font-family:'Jua';font-size:16px;}
  .streak.card-badge{background:#EAF3FF;border-color:#BFDBFF;color:#2E6BB5;}
  /* panel */
  .panel{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:0 6px 16px rgba(0,0,0,.08);text-align:center;}
  /* buttons */
  .btn{font-family:'Jua';font-size:22px;border:none;border-radius:20px;padding:18px 22px;cursor:pointer;width:100%;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .1s;margin-top:10px;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
  .btn-primary{background:#3FA796;}
  .btn-speed{background:#E8633F;}.btn-memory{background:#1E8E7B;}
  .btn-seq{background:#D9952A;}.btn-math{background:#8A5BA2;}
  .btn-ghost{background:var(--paper);color:var(--ink);border:none;box-shadow:0 6px 16px rgba(0,0,0,.08);}
  .btn-row{display:flex;gap:12px;}
  .btn-row .btn{font-size:20px;padding:16px;}
  .btn-small{font-size:16px;padding:12px;margin-top:8px;}
  /* scoreline */
  .scoreline{display:flex;justify-content:space-between;align-items:center;font-family:'Jua';font-size:20px;margin-bottom:14px;padding:0 2px;}
  .pill{background:var(--paper);border:none;box-shadow:0 4px 10px rgba(0,0,0,.06);border-radius:999px;padding:8px 18px;}
  /* stage top bar */
  .stage-bar{border-radius:18px;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;font-family:'Jua';font-size:18px;color:#fff;margin-bottom:14px;}
  .stage-bar.speed-bar{background:linear-gradient(135deg,#F2926F,#E8633F);}
  .stage-bar.memory-bar{background:linear-gradient(135deg,#46B7A2,#1E8E7B);}
  .stage-bar.seq-bar{background:linear-gradient(135deg,#ECB857,#D9952A);}
  .stage-bar.math-bar{background:linear-gradient(135deg,#AD85C2,#8A5BA2);}
  /* speed game */
  /* speed game cell touch flourish */
  .flashgrid{display:grid;gap:12px;margin:8px auto 4px;}
  .cell{position:relative;background:#FFF;border:3px solid var(--line);border-radius:16px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:transform .12s cubic-bezier(.34,1.56,.64,1),background .15s,border-color .15s,box-shadow .15s;}
  .cell:active{transform:scale(.9) translateY(2px);}
  .cell.lit{background:#FFF3DF;border-color:var(--speed);animation:flashIn .15s ease;}
  .cell.correct{background:#E5F6F0;border-color:var(--ok);box-shadow:0 0 20px rgba(63,167,150,.5);animation:tapPop .38s cubic-bezier(.34,1.56,.64,1);}
  .cell.wrong{background:#FCE7E5;border-color:var(--warn);animation:shake .35s ease;}
  .cell.selected{background:#FFF3DF;border-color:var(--speed);border-width:4px;box-shadow:0 0 18px rgba(238,123,91,.55);animation:tapPop .32s cubic-bezier(.34,1.56,.64,1);}
  .countdown{font-family:'Jua';font-size:80px;color:var(--speed);animation:pop .4s;}
  .score-float{position:absolute;font-family:'Jua';font-size:22px;color:var(--ok);pointer-events:none;z-index:30;animation:scoreFloatUp .8s cubic-bezier(.1,.8,.2,1) forwards;text-shadow:0 2px 8px rgba(0,0,0,.18);}
  @keyframes scoreFloatUp{0%{opacity:0;transform:translateY(0) scale(.5);}30%{opacity:1;transform:translateY(-18px) scale(1.25);}100%{opacity:0;transform:translateY(-42px) scale(1);}}

  /* memory card dealing drop animation */
  .memgrid{display:grid;gap:10px;margin-top:6px;justify-content:center;perspective:800px;}
  .mcard{aspect-ratio:3/4;border-radius:16px;cursor:pointer;position:relative;perspective:600px;transition:transform .12s;}
  .mcard:active{transform:scale(.95);}
  .mcard .inner{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d;}
  .mcard.flipped .inner,.mcard.matched .inner{transform:rotateY(180deg);}
  .mface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:16px;backface-visibility:hidden;}
  .mfront{background:linear-gradient(150deg,#46B7A2,#1E8E7B);color:#fff;font-family:'Jua';font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.15);}
  .mback{background:#FFF;border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.06);transform:rotateY(180deg);font-size:36px;}
  .mcard.matched .mback{border-color:var(--ok);background:#E5F6F0;}
  @keyframes dealDrop{
    0%{opacity:0;transform:translate(var(--dx, 0px), var(--dy, -160px)) scale(0.3) rotate(var(--drot, 20deg));}
    65%{opacity:1;transform:translate(0, 0) scale(1.1) rotate(0deg);}
    85%{transform:scale(0.95);}
    100%{opacity:1;transform:scale(1) rotate(0deg);}
  }
  .mcard.dealing{animation:dealDrop .45s cubic-bezier(.34,1.5,.64,1) both;}
  /* seq pads */
  .padwrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:360px;margin:8px auto;}
  .pad{aspect-ratio:1/1;border-radius:24px;cursor:pointer;border:4px solid rgba(0,0,0,.08);opacity:.5;filter:saturate(1) brightness(1);transition:opacity .12s,transform .16s cubic-bezier(.34,1.56,.64,1),filter .16s;box-shadow:0 6px 0 rgba(0,0,0,.12);}
  .pad:active{transform:translateY(3px);}
  .pad.on{opacity:1;transform:scale(1.16);filter:saturate(1.75) brightness(1.15);}
  .pad.p0{background:#E8635B;}.pad.p1{background:#5BB98C;}
  .pad.p2{background:#5B8DEF;}.pad.p3{background:#EAC23D;}
  .pad.p0.on{box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 26px 8px rgba(232,99,91,.6);}
  .pad.p1.on{box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 26px 8px rgba(91,185,140,.6);}
  .pad.p2.on{box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 26px 8px rgba(91,141,239,.6);}
  .pad.p3.on{box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 26px 8px rgba(234,194,61,.6);}
  /* math */
  .qbox{font-family:'Jua';font-size:60px;margin:6px 0;}
  .timerbar{height:14px;background:#EFE2CC;border-radius:999px;overflow:hidden;margin:4px 0 16px;}
  .timerfill{height:100%;background:var(--math);width:100%;transition:width .1s linear;}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .choice{font-family:'Jua';font-size:32px;background:#FFF;border:2px solid var(--line);border-radius:16px;padding:20px 0;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.06);}
  .choice:active{transform:translateY(3px);box-shadow:none;}
  .choice.right{background:#E5F6F0;border-color:var(--ok);}
  .choice.wrongpick{background:#FCE7E5;border-color:var(--warn);}
  /* result */
  .stars{font-size:50px;letter-spacing:6px;margin:6px 0;}
  .domain-row{margin-bottom:14px;}
  .domain-row .dlabel{display:flex;justify-content:space-between;font-family:'Jua';font-size:19px;margin-bottom:6px;}
  .dtrack{background:#F0E8D8;border-radius:999px;height:16px;overflow:hidden;}
  .dfill{height:100%;border-radius:999px;transition:width .9s ease;}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(58,46,40,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;}
  .modal{background:var(--paper);border-radius:26px;max-width:480px;width:100%;padding:26px 24px;box-shadow:var(--shadow);max-height:84vh;overflow:auto;}
  /* verse card modal (6-hour popup) */
  .verse-modal{background:linear-gradient(180deg,#FFFDF8 0%,#FAF3E6 100%);border:2px solid #EADBCA;border-radius:28px;max-width:440px;width:100%;padding:28px 22px 24px;box-shadow:0 14px 40px rgba(100,70,40,0.22);text-align:center;position:relative;}
  .verse-badge{display:inline-flex;align-items:center;gap:6px;background:#FFF0D0;border:1.5px solid #E8C488;color:#9B5E14;border-radius:999px;padding:6px 16px;font-family:'Jua';font-size:15px;margin-bottom:14px;}
  .verse-quote-wrap{position:relative;padding:6px 12px 14px;}
  .verse-quote-mark{font-family:'Jua';font-size:32px;color:#D8BF9E;line-height:1;user-select:none;}
  .verse-text{font-size:18px;line-height:1.8;color:#3A2E28;word-break:keep-all;text-wrap:balance;white-space:pre-line;font-weight:400;margin:4px 0 10px;}
  .verse-ref{font-family:'Jua';font-size:15px;color:#EE7B5B;display:inline-block;background:#FFF;padding:6px 14px;border-radius:12px;border:1.5px solid #F5DECB;}
  .verse-btn{margin-top:20px;width:100%;font-size:20px;padding:15px;border-radius:18px;background:linear-gradient(135deg,#EE7B5B,#E8633F);color:#fff;border:none;box-shadow:0 5px 0 #C95535;cursor:pointer;font-family:'Jua';}
  .verse-btn:active{transform:translateY(3px);box-shadow:none;}
  .topbar-btns{display:flex;align-items:center;gap:8px;}

  /* ----------------------------------------------------
     선물 상자 3개 선택 및 보상 화면 애니메이션 & 책갈피 스타일
     ---------------------------------------------------- */
  @keyframes chestFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @keyframes chestShake {
    0%, 100% { transform: scale(1.08) rotate(0deg); }
    20% { transform: scale(1.08) rotate(-6deg); }
    40% { transform: scale(1.08) rotate(6deg); }
    60% { transform: scale(1.08) rotate(-4deg); }
    80% { transform: scale(1.08) rotate(4deg); }
  }
  @keyframes softPulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.04); }
  }
  .chest-pick-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 18px 0 12px;
  }
  .chest-item {
    background: #FFFBF4;
    border: 2px solid #EADBCA;
    border-radius: 20px;
    padding: 12px 6px 14px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
    box-shadow: 0 6px 0 rgba(0,0,0,0.06);
    user-select: none;
  }
  .chest-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 0 rgba(0,0,0,0.08);
    border-color: #E8633F;
  }
  .chest-item:active {
    transform: translateY(2px);
    box-shadow: none;
  }
  .chest-item.floating {
    animation: chestFloat 2.2s ease-in-out infinite;
  }
  .chest-item:nth-child(2).floating {
    animation-delay: 0.35s;
  }
  .chest-item:nth-child(3).floating {
    animation-delay: 0.7s;
  }
  .chest-item.selected {
    border-color: #FFD166;
    background: #FFF3D6;
    box-shadow: 0 0 24px rgba(255, 209, 102, 0.75);
    animation: chestShake 0.6s ease;
  }
  .chest-item.dimmed {
    opacity: 0.25;
    pointer-events: none;
    transform: scale(0.92);
  }
  .chest-item img {
    width: 100%;
    max-width: 105px;
    aspect-ratio: 1/1;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
  }
  .chest-label {
    font-family: 'Jua', sans-serif;
    font-size: 15px;
    color: var(--ink);
    margin-top: 6px;
  }

  /* 보상 화면 풀스크린 오버레이 */
  .reward-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    cursor: pointer;
    overflow-y: auto;
    animation: zoomFadeIn 0.35s ease both;
  }

  /* 말씀카드 책갈피 (Bookmark Card Layout) */
  .bookmark-card-wrap {
    width: 260px;
    max-width: 82vw;
    background: #FFFFFF;
    border-radius: 12px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    position: relative;
    text-align: left;
    margin: 10px auto;
    animation: jellyPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .bookmark-header {
    height: 145px;
    width: 100%;
    background-image: url('assets/bookmark-mosaic.svg');
    background-size: cover;
    background-position: center;
    position: relative;
  }
  .bookmark-body {
    padding: 16px 18px 20px;
    background: #FFFFFF;
    position: relative;
  }
  .bookmark-cross {
    color: #C93B3B;
    font-size: 18px;
    font-weight: bold;
    margin-right: 4px;
    display: inline-block;
  }
  .bookmark-korean-verse {
    font-size: 16px;
    line-height: 1.75;
    color: #2D2727;
    font-weight: 500;
    word-break: keep-all;
    text-wrap: balance;
    white-space: pre-line;
    margin: 4px 0 12px;
    letter-spacing: -0.2px;
  }
  .bookmark-seal {
    display: inline-block;
    vertical-align: middle;
    background: #C93B3B;
    color: #FFF;
    font-size: 9px;
    line-height: 1.1;
    padding: 2px 3px;
    border-radius: 2px;
    font-weight: bold;
    margin-left: 6px;
    letter-spacing: 0.5px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(201, 59, 59, 0.4);
  }
  .bookmark-divider {
    height: 1px;
    background: linear-gradient(90deg, #E6A5A5 0%, #EADBCA 100%);
    margin: 12px 0 10px;
  }
  .bookmark-ref {
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    color: #333333;
    margin-bottom: 5px;
  }
  .bookmark-eng-verse {
    font-size: 11px;
    line-height: 1.45;
    color: #7A6A5E;
    font-style: normal;
    word-break: keep-all;
  }
  .touch-hint {
    font-family: 'Jua', sans-serif;
    font-size: 15px;
    color: #FFFFFF;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    margin-top: 18px;
    animation: softPulse 1.6s infinite ease-in-out;
  }
  /* transition */
  .trans-next{background:var(--paper);border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.06);padding:16px 20px;margin-top:14px;text-align:left;}
  /* confetti */
  .confetti-item{position:fixed;top:-10px;font-size:22px;pointer-events:none;z-index:70;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.9;}}
  /* progress dots */
  .prog{display:flex;gap:8px;justify-content:center;margin:16px 0;align-items:center;}
  .prog-dot{width:12px;height:12px;border-radius:50%;background:var(--line);transition:all .3s;}
  .prog-dot.done{background:var(--ok);width:14px;height:14px;}
  .prog-dot.current{background:var(--speed);width:18px;height:18px;}
  /* numpad */
  .npdigits{display:flex;justify-content:center;align-items:center;gap:8px;min-height:58px;margin:22px 0 28px;flex-wrap:wrap;}
  .np-digit{display:inline-block;font-family:'Jua';font-size:42px;line-height:1;color:var(--speed);min-width:26px;text-align:center;}
  @keyframes digitBurstIn{
    0%{transform:scale(2.4);opacity:0;}
    50%{transform:scale(.82);opacity:1;}
    75%{transform:scale(1.18);}
    100%{transform:scale(1);}
  }
  .np-digit.just-typed{animation:digitBurstIn .4s cubic-bezier(.34,1.56,.64,1);}
  .numpad{display:grid;grid-template-columns:repeat(3,74px);gap:16px;justify-content:center;margin:0 auto;}

// ---------- STORAGE LAYER (Claude 아티팩트 window.storage 우선, 안되면 localStorage로 자동 전환) ----------
const hasCloudStorage = (typeof window!=='undefined') && window.storage && typeof window.storage.get==='function';
async function stGet(key){
  if(hasCloudStorage){
    try{ const r=await window.storage.get(key, true); if(r&&r.value!==undefined) return r.value; }catch(e){}
  }
  try{ const v=localStorage.getItem(key); return v===null?undefined:v; }catch(e){ return undefined; }
}
async function stSet(key, value){
  let ok=false;
  if(hasCloudStorage){
    try{ await window.storage.set(key, value, true); ok=true; }catch(e){}
  }
  try{ localStorage.setItem(key, value); ok=true; }catch(e){}
  return ok;
}
async function stDelete(key){
  if(hasCloudStorage){ try{ await window.storage.delete(key, true); }catch(e){} }
  try{ localStorage.removeItem(key); }catch(e){}
}
async function stListKeys(prefix){
  if(hasCloudStorage){
    try{ const r=await window.storage.list(prefix, true); if(r&&r.keys) return r.keys; }catch(e){}
  }
  const keys=[];
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf(prefix)===0) keys.push(k); } }catch(e){}
  return keys;
}

/**
 * 현재 시간(24H)을 기준으로 6시간 주기 슬롯 정보 및 구절을 계산
 * @returns {{slotKey: string, slotIndex: number, slotMeta: {name: string, icon: string, sub: string}, verse: Object}}
 */
function getVerseSlotInfo() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const date = String(now.getDate()).padStart(2, '0');
  const hour = now.getHours();
  const slotIndex = Math.floor(hour / 6); // 0 (00-06), 1 (06-12), 2 (12-18), 3 (18-24)

  // 시간대별 테마 및 인사말
  const slotMeta = [
    { name: '새벽의 묵상', icon: '✨', sub: '고요한 새벽을 밝히는 말씀' },
    { name: '아침의 말씀', icon: '☀️', sub: '활기찬 하루를 여는 말씀' },
    { name: '오후의 쉼',   icon: '🌿', sub: '지친 마음에 힘을 주는 말씀' },
    { name: '평안한 밤',   icon: '🌙', sub: '하루를 감사로 맺는 말씀' }
  ][slotIndex];

  // 하루 4슬롯 고유 키 (예: verse_shown_2026-08-27_slot_1)
  const slotKey = `verse_shown_${year}-${month}-${date}_slot_${slotIndex}`;
  // 날짜와 슬롯 인덱스를 조합하여 순차적으로 말씀이 순환되도록 인덱스 결정
  const dayNumber = Math.floor(now.getTime() / (24 * 60 * 60 * 1000));
  const verseIndex = (dayNumber * 4 + slotIndex) % BIBLE_VERSES.length;

  return { slotKey, slotIndex, slotMeta, verse: BIBLE_VERSES[verseIndex] };
}

/**
 * 오늘의 말씀 모달 팝업 표시
 * @param {boolean} force - true일 경우 이미 봤더라도 강제로 표시 (상단 📖 버튼 클릭 시)
 * @returns {boolean} 실제로 팝업이 떴는지 여부
 */
function showVerseCard(force = false) {
  const info = getVerseSlotInfo();
  // 자동 팝업 모드일 때 이미 해당 슬롯에 본 기록이 있으면 건너뜀
  if (!force && localStorage.getItem(info.slotKey)) {
    return false;
  }

  const v = info.verse;
  const ov = el(`
    <div class="overlay" style="z-index:90;">
      <div class="verse-modal fade">
        <div class="verse-badge">${info.slotMeta.icon} ${info.slotMeta.name}</div>
        <div style="font-size:13px;color:var(--ink-soft);margin-top:-8px;margin-bottom:12px;">${info.slotMeta.sub}</div>
        <div class="verse-quote-wrap">
          <div class="verse-quote-mark" style="text-align:left;">“</div>
          <div class="verse-text">${v.content}</div>
          <div class="verse-quote-mark" style="text-align:right;">”</div>
        </div>
        <div>
          <span class="verse-ref">${v.ref} <span style="font-size:12px;color:var(--ink-soft);font-weight:normal;">(새번역)</span></span>
        </div>
        <button class="verse-btn" id="closeVerseBtn">마음에 새기기 🙏</button>
      </div>
    </div>
  `);

  document.body.appendChild(ov);

  // 모달 닫기 및 해당 슬롯 확인 기록 저장
  const close = () => {
    localStorage.setItem(info.slotKey, 'true');
    ov.remove();
  };

  ov.querySelector('#closeVerseBtn').addEventListener('click', close);
  ov.addEventListener('click', (e) => {
    if (e.target === ov) close();
  });
  return true;
}

// ---------- assets/cards 폴더 자동 인식 (가장 쉬운 방법) ----------
// 이 세 값만 저장소 정보에 맞게 채워두면, assets/cards 폴더에 이미지 파일만 넣어도
// 코드 수정 없이 자동으로 기본 카드가 됩니다. (GitHub 공개 저장소 전용, 비공개 저장소면 작동 안 함)
const REPO_OWNER='aaroncode7392-jpg';
const REPO_NAME='marketing_calendar';
const REPO_CARDS_PATH='brain-game/assets/cards';
let assetCardsCache=null, assetCardsLoaded=false;
async function loadAssetCards(){
  if(assetCardsLoaded) return assetCardsCache;
  assetCardsLoaded=true;
  if(!REPO_OWNER||!REPO_NAME){ assetCardsCache=[]; return assetCardsCache; }
  try{
    const res=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${REPO_CARDS_PATH}`, {cache:'no-store'});
    if(!res.ok){ assetCardsCache=[]; return assetCardsCache; }
    const files=await res.json();
    assetCardsCache = Array.isArray(files) ? files
      .filter(f=>f.type==='file' && /\.(png|jpe?g|gif|webp)$/i.test(f.name))
      .map(f=>({
        id:'asset_'+f.name.replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9가-힣_-]/g,'_'),
        name:f.name.replace(/\.[^.]+$/,''),
        file:`assets/cards/${f.name}`
      })) : [];
  }catch(e){ assetCardsCache=[]; }
  return assetCardsCache;
}

let sharedCardsCache=null, sharedCardsLoaded=false;
async function loadSharedCards(){
  if(sharedCardsLoaded) return sharedCardsCache;
  try{
    const res=await fetch('assets/cards-data.json', {cache:'no-store'});
    sharedCardsCache = res.ok ? await res.json() : [];
    if(!Array.isArray(sharedCardsCache)) sharedCardsCache=[];
  }catch(e){ sharedCardsCache=[]; }
  sharedCardsLoaded=true;
  return sharedCardsCache;
}

// ---------- STORAGE HELPERS (카드/회원 데이터) ----------
async function loadCardIndex(){
  const [assetCards, shared]=await Promise.all([loadAssetCards(), loadSharedCards()]);
  const v=await stGet('bg:cards:index');
  const stored=v?JSON.parse(v):[];
  const sharedMeta=shared.map(c=>({id:c.id, name:c.name, mime:c.mime, addedAt:c.addedAt}));
  const seen=new Set(); const merged=[];
  for(const c of [...DEFAULT_CARDS, ...assetCards, ...sharedMeta, ...stored]){
    if(seen.has(c.id)) continue;
    seen.add(c.id); merged.push(c);
  }
  return merged;
}
async function saveCardIndex(idx){
  // 기본·에셋 폴더·공유 파일 카드는 이 기기 저장소에 저장하지 않음 — 항상 원본에서 다시 채워짐
  const [assetCards, shared]=await Promise.all([loadAssetCards(), loadSharedCards()]);
  const lockedIds=new Set([...assetCards.map(c=>c.id), ...shared.map(c=>c.id)]);
  const extra=idx.filter(c=>!String(c.id).startsWith('default_') && !lockedIds.has(c.id));
  await stSet('bg:cards:index', JSON.stringify(extra));
}
async function getCardImage(id){
  const dc=DEFAULT_CARDS.find(c=>c.id===id);
  if(dc) return dc.file;
  const assetCards=await loadAssetCards();
  const ac=assetCards.find(c=>c.id===id);
  if(ac) return ac.file;
  const shared=await loadSharedCards();
  const sc=shared.find(c=>c.id===id);
  if(sc) return sc.img;
  const v=await stGet('bg:cards:img:'+id);
  return v||null;
}
async function saveCardImage(id, dataUrl){
  return await stSet('bg:cards:img:'+id, dataUrl);
}
async function deleteCardImage(id){
  if(String(id).startsWith('default_')) return; // 에셋 폴더(코드 등록) 카드는 코드에서만 관리
  const assetCards=assetCardsCache||[];
  const shared=sharedCardsCache||[];
  if(assetCards.some(c=>c.id===id)) return; // assets/cards 폴더 카드는 그 폴더에서 파일을 지워야 함
  if(shared.some(c=>c.id===id)) return; // 공유 파일 카드는 assets/cards-data.json 자체를 교체해야 함
  await stDelete('bg:cards:img:'+id);
}

function initFirebase(){

  if(typeof firebase==='undefined') return null;

async function loadOrCreateMember(bd){
  const db=initFirebase();
  if(db){
    try{
      const ref=db.collection('members').doc(bd);
      const snap=await ref.get();
      if(snap.exists){
        const m=snap.data();
        m.lastLogin=new Date().toISOString();
        await ref.set(m, {merge:true});
        return {member:m, isNew:false};
      }
      const m={ birthdate:bd, joinedAt:new Date().toISOString(), lastLogin:new Date().toISOString(),
        streak:0, lastDay:null, bestTotal:0, level:8, cards:{} };
      await ref.set(m);
      return {member:m, isNew:true};
    }catch(e){ /* Firebase 실패 시 아래 로컬 저장 방식으로 폴백 */ }
  }
  const v=await stGet('bg:member:'+bd);
  if(v){
    const m=JSON.parse(v);
    m.lastLogin=new Date().toISOString();
    await saveMemberRaw(m);
    return {member:m, isNew:false};
  }
  const m = { birthdate:bd, joinedAt:new Date().toISOString(), lastLogin:new Date().toISOString(),
    streak:0, lastDay:null, bestTotal:0, level:8, cards:{} };
  await saveMemberRaw(m);
  return {member:m, isNew:true};
}
async function saveMemberRaw(m){
  const db=initFirebase();
  if(db){
    try{ await db.collection('members').doc(m.birthdate).set(m, {merge:true}); return; }catch(e){}
  }
  await stSet('bg:member:'+m.birthdate, JSON.stringify(m));
}
function saveMember(){ if(currentMember) saveMemberRaw(currentMember); }
async function listAllMembers(){
  const db=initFirebase();
  if(db){
    try{
      const snap=await db.collection('members').get();
      const members=[];
      snap.forEach(doc=>members.push(doc.data()));
      return members.sort((a,b)=> (b.lastLogin||'').localeCompare(a.lastLogin||''));
    }catch(e){ /* 실패 시 아래 로컬 목록으로 폴백 */ }
  }
  const keys=await stListKeys('bg:member:');
  const members=[];
  for(const k of keys){
    try{ const v=await stGet(k); if(v) members.push(JSON.parse(v)); }catch(e){}
  }
  return members.sort((a,b)=> (b.lastLogin||'').localeCompare(a.lastLogin||''));
}

function markPlayedToday(){
  const today=new Date().toISOString().slice(0,10);
  if(currentMember.lastDay===today) return;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  currentMember.streak=(currentMember.lastDay===y)?(currentMember.streak||0)+1:1;
  currentMember.lastDay=today; saveMember();
}

let audioCtx=null;
function beep(freq,dur=0.18){
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=freq;o.type='sine';o.connect(g);g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18,audioCtx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function juiceTap(el){
  if(!el) return;
  el.classList.remove('tap-pop'); void el.offsetWidth; el.classList.add('tap-pop');
  setTimeout(()=>el.classList.remove('tap-pop'),380);
}
function celebrateAt(el,{count=10,parts=['✨','⭐','🌟','💫','🎊']}={}){
  if(!el) return;
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='mini-burst-particle';
    p.textContent=pick(parts);
    p.style.left=cx+'px'; p.style.top=cy+'px';
    const angle=Math.random()*Math.PI*2, dist=34+Math.random()*62;
    p.style.setProperty('--bx',(Math.cos(angle)*dist)+'px');
    p.style.setProperty('--by',(Math.sin(angle)*dist)+'px');
    p.style.fontSize=(15+Math.random()*13)+'px';
    p.style.animationDelay=(Math.random()*0.08)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),850);
  }
}
function readFileAsDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error('read failed'));
    r.readAsDataURL(file);
  });
}
// 큰 이미지를 자동으로 축소·압축해서 localStorage 용량 초과를 방지 (gif는 애니메이션 보존을 위해 원본 그대로 사용)
function toStorableImage(file, maxDim=640){
  return new Promise((resolve)=>{
    if(file.type==='image/gif'){ readFileAsDataURL(file).then(resolve).catch(()=>resolve(null)); return; }
    readFileAsDataURL(file).then(raw=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>maxDim||height>maxDim){
          if(width>=height){ height=Math.round(height*maxDim/width); width=maxDim; }
          else{ width=Math.round(width*maxDim/height); height=maxDim; }
        }
        try{
          const canvas=document.createElement('canvas');
          canvas.width=width; canvas.height=height;
          const ctx=canvas.getContext('2d');
          ctx.drawImage(img,0,0,width,height);
          resolve(canvas.toDataURL('image/png'));
        }catch(e){ resolve(raw); }
      };
      img.onerror=()=>resolve(raw);
      img.src=raw;
    }).catch(()=>resolve(null));
  });
}

function renderNumpadScreen({title, subtitle, length, mask=false, errorMsg='', onSubmit, footerHtml='', afterRender}){
  clear();
  let digits='';

  function digitsHtml(){
    let html='';
    for(let i=0;i<digits.length;i++){
      const justTyped=i===digits.length-1;
      html+=`<span class="np-digit${justTyped?' just-typed':''}">${mask?'●':digits[i]}</span>`;
    }
    return html;
  }

  const v=el(`
    <div class="fade" style="display:flex;flex-direction:column;justify-content:center;min-height:78vh;">
      <div style="text-align:center;">
        <div style="font-size:44px;">🧠</div>
        <div style="font-family:'Jua';font-size:24px;margin-top:8px;">${title}</div>
        <div style="font-size:15px;color:var(--ink-soft);margin-top:4px;">${subtitle}</div>
        ${errorMsg?`<div style="color:var(--warn);font-family:'Jua';font-size:15px;margin-top:10px;">${errorMsg}</div>`:''}
      </div>
      <div class="npdigits" id="npdigits">${digitsHtml()}</div>
      <div class="numpad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="npkey" data-k="${n}">${n}</button>`).join('')}
        <button class="npkey npkey-clear" data-k="clear">지우기</button>
        <button class="npkey" data-k="0">0</button>
        <button class="npkey npkey-back" data-k="back">⌫</button>
      </div>
      <div class="np-footer">${footerHtml}</div>
    </div>`);
  app.appendChild(v);
  const digitsEl=v.querySelector('#npdigits');
  let locked=false;
  v.querySelectorAll('.npkey').forEach(b=>{
    b.addEventListener('click',()=>{
      if(locked) return;
      juiceTap(b);
      const k=b.dataset.k;
      if(k==='clear'){ digits=''; }
      else if(k==='back'){ digits=digits.slice(0,-1); }
      else if(digits.length<length){ digits+=k; beep(440,0.05); }
      digitsEl.innerHTML=digitsHtml();
      const justTyped=digitsEl.querySelector('.just-typed');
      if(justTyped) celebrateAt(justTyped,{count:5});
      if(digits.length===length){
        locked=true;
        celebrateAt(digitsEl,{count:12});
        setTimeout(()=>onSubmit(digits),220);
      }
    });
  });
  if(afterRender) afterRender(v);
}

function pushCapped(arr, item, cap=50){
  const a=Array.isArray(arr)?arr.slice():[];
  a.push(item);
  if(a.length>cap) a.splice(0, a.length-cap);
  return a;
}
async function attemptLogin(bd){
  const mo=+bd.slice(2,4), d=+bd.slice(4,6);
  const valid = mo>=1 && mo<=12 && d>=1 && d<=31;
  if(!valid){ return renderLoginScreen('생년월일을 다시 확인해주세요'); }

  currentMember = member;
  currentMember.loginLog = pushCapped(currentMember.loginLog, new Date().toISOString());
  saveMember();
  cardIndex = await loadCardIndex();
  renderSplashScreen(isNew);
  await checkPendingGift();
}

let session=null;

function buildStages(L){
  const L2=Math.min(10,L+1);
  return [
    {type:'speed', label:'⚡ 순간 포착', domain:'speed', lv:L},
    {type:'seq',   label:'🎵 순서 기억', domain:'seq',   lv:L},
    {type:'math',  label:'🔢 빠른 셈',   domain:'math',  lv:L},
    {type:'memory',label:'🃏 짝 맞추기', domain:'memory',lv:L},
    {type:'speed', label:'⚡ 순간 포착', domain:'speed', lv:L2},
    {type:'math',  label:'🔢 빠른 셈',   domain:'math',  lv:L2},
    {type:'seq',   label:'🎵 순서 기억', domain:'seq',   lv:L2},
    {type:'memory',label:'🃏 짝 맞추기', domain:'memory',lv:L2},
  ];
}
function startSession(){
  setGameBackground('assets/bg_landscape_'+(Math.floor(Math.random()*10)+1)+'.jpg');
  markPlayedToday();
  const L=curLevel();
  session={ stages:buildStages(L), idx:0, domainScores:{speed:[],memory:[],seq:[],math:[]} };
  showTransition(null,null,true);
}
function onGameDone(score100){
  const stage=session.stages[session.idx];
  session.domainScores[stage.domain].push(score100);
  session.idx++;
  if(session.idx>=session.stages.length) showFinalResult();
  else showTransition(stage, score100, false);
}
function showTransition(prevStage, prevScore, isFirst){
  clear();
  const {idx, stages}=session;
  const next=stages[idx];
  const total=stages.length;
  const dots=stages.map((_,i)=>{const cls=i<idx?'done':i===idx?'current':'';return `<div class="prog-dot ${cls}"></div>`;}).join('');
  const prevHtml=isFirst?`
    <div style="font-family:'Jua';font-size:28px;margin-bottom:6px;">준비됐나요? 😊</div>
    <div style="font-size:17px;color:var(--ink-soft);line-height:1.6;">4가지 두뇌 운동을 8스테이지로 연속해서 해봐요.<br>천천히, 즐겁게!</div>`:
    `<div style="font-size:16px;color:var(--ink-soft);margin-bottom:4px;">스테이지 ${idx} 완료!</div>
     <div style="font-family:'Jua';font-size:21px;color:var(--ink-soft);margin-bottom:6px;">${prevStage.label}</div>
     <div style="font-family:'Jua';font-size:56px;color:${scoreColor(prevScore)};line-height:1.1;">${prevScore}점</div>`;
  const colorMap={speed:'#E8633F',memory:'#1E8E7B',seq:'#D9952A',math:'#8A5BA2'};
  const v=el(`
    <div class="fade">
      <div class="panel" style="text-align:center;padding:26px 20px;">
        ${prevHtml}
        <div class="prog">${dots}</div>
        ${idx<total?`
        <div class="trans-next">
          <div style="font-size:13px;color:var(--ink-soft);margin-bottom:5px;">다음 스테이지 ${idx+1}/${total}</div>
          <div style="font-family:'Jua';font-size:22px;">${next.label}</div>
        </div>`:''}
        <button class="btn" id="goNext" style="background:${colorMap[next.type]};margin-top:16px;font-size:23px;padding:19px;">
          ${isFirst?'시작하기':'다음 스테이지 →'}
        </button>
      </div>
    </div>`);
  app.appendChild(v);
  v.querySelector('#goNext').addEventListener('click',()=>runGame(next, onGameDone));
}
function runGame(stage, onDone){
  if(stage.type==='speed') playSpeed({lv:stage.lv, rounds:5, onDone});
  else if(stage.type==='memory') playMemory({lv:stage.lv, onDone});
  else if(stage.type==='seq') playSeq({lv:stage.lv, onDone});
  else if(stage.type==='math') playMath({lv:stage.lv, qs:6, onDone});
}
function stageBar(){
  if(!session) return '';
  const {idx,stages}=session; const s=stages[idx];
  return `<div class="stage-bar ${s.type}-bar"><span>${s.label}</span><span>스테이지 ${idx+1} / ${stages.length}</span></div>`;
}

// GAME 1: 순간 포착
// ==========================================================
function playSpeed({lv, rounds=5, onDone=null}={}){
  const s0=speedStart(lv||curLevel());
  const findCount=s0.findCount, size=s0.size;
  let round=0, totalScore=0, flash=s0.flash;
  const totalRounds=rounds;
  const maxScore=totalRounds*findCount;
  const emojiFs=size===3?'38px':'30px';

  function frame(inner){
    clear();
    const v=el(`
      <div class="fade">
        ${stageBar()}
        <div class="scoreline"><span class="pill">⚡ ${round}/${totalRounds}</span><span class="pill" id="sc">맞춘 칸 ${totalScore}</span></div>
        <div class="panel" id="stage">${inner}</div>
      </div>`);
    app.appendChild(v);
    return v.querySelector('#stage');
  }
  function next(){
    if(round>=totalRounds){ const score=Math.round(totalScore/maxScore*100); return onDone?onDone(score):null; }
    round++;
    const stage=frame(`<div class="countdown" id="cd" style="font-size:70px;">준비</div>`);
    const cd=stage.querySelector('#cd');
    setTimeout(()=>{cd.textContent='잘 보세요!';cd.style.color='var(--speed)';},300);
    setTimeout(showFlash,900);
  }
  function showFlash(){
    const n=size*size;
    const positions=shuffle([...Array(n).keys()]).slice(0,findCount);
    const emojis=shuffle(EMOJIS.slice()).slice(0,findCount);
    let cells='';
    for(let i=0;i<n;i++){
      const pi=positions.indexOf(i);
      cells+=`<div class="cell" data-i="${i}" style="font-size:${emojiFs}">${pi>=0?`<span>${emojis[pi]}</span>`:''}</div>`;
    }
    const stage=frame(`
      <div id="label" style="font-family:'Jua';font-size:22px;margin-bottom:10px;">잘 보세요! <span style="color:var(--speed)">${findCount}개</span></div>
      <div class="flashgrid" style="grid-template-columns:repeat(${size},1fr);max-width:${size===3?'360px':'340px'};">${cells}</div>`);
    const grid=stage.querySelector('.flashgrid');
    positions.forEach(p=>grid.querySelector(`[data-i="${p}"]`).classList.add('lit'));
    setTimeout(()=>{
      grid.querySelectorAll('.cell').forEach(c=>{c.classList.remove('lit');c.innerHTML='';});
      askWhere(grid,positions);
    },flash);
  }
  function askWhere(grid,targets){
    const label=document.querySelector('#label');
    const targetSet=new Set(targets); const selected=new Set(); let done=false;
    label.innerHTML=`어디에 있었나요? <span id="cnt" style="color:var(--speed)">0/${findCount}</span>`;
    const cnt=label.querySelector('#cnt');
    grid.querySelectorAll('.cell').forEach(c=>{
      c.style.cursor='pointer';
      c.addEventListener('click',()=>{
        if(done) return;
        const i=+c.dataset.i;
        if(selected.has(i)){
          selected.delete(i);
          c.classList.remove('selected');
          c.innerHTML='';
          beep(440, 0.06);
          cnt.textContent=`${selected.size}/${findCount}`;
          return;
        }
        selected.add(i);
        c.classList.add('selected');
        c.innerHTML='<span style="font-size:26px;animation:pop .25s ease;">✓</span>';
        juiceTap(c);
        celebrateAt(c, {count: 7, parts: ['✨','⚡','💥','🔸','⭐']});
        beep(660, 0.08);
        cnt.textContent=`${selected.size}/${findCount}`;
        if(selected.size>=findCount) submitAnswer();
      });
    });
    function submitAnswer(){
      done=true; let roundScore=0;
      grid.querySelectorAll('.cell').forEach(c=>{
        const i=+c.dataset.i,isTgt=targetSet.has(i),isPick=selected.has(i);
        c.classList.remove('selected'); c.innerHTML='';
        if(isTgt&&isPick){
          c.classList.add('correct');
          c.innerHTML='✅';
          roundScore++;
          juiceTap(c);
          celebrateAt(c,{count:14, parts:['✨','⭐','🌟','🎉','🎊']});
          // Floating 점수 태그 효과
          const floatTag = el(`<div class="score-float">+1 ⭐</div>`);
          c.appendChild(floatTag);
          setTimeout(()=>floatTag.remove(), 850);
        }
        else if(!isTgt&&isPick){
          c.classList.add('wrong');
          c.innerHTML='❌';
          celebrateAt(c,{count:5, parts:['💨','❌']});
        }
        else if(isTgt&&!isPick){
          c.classList.add('correct');
          c.style.opacity='.55';
          c.innerHTML='⭐';
        }
      });
      if(roundScore > 0){
        beep(587, 0.09); setTimeout(()=>beep(784, 0.16), 80);
      } else {
        beep(220, 0.15);
      }
      totalScore+=roundScore;
      const sc=document.querySelector('#sc'); if(sc) sc.textContent='맞춘 칸 '+totalScore;
      const allRight=roundScore===findCount;
      if(allRight) flash=Math.max(350,flash-90); else flash=Math.min(1700,flash+130);
      if(allRight) confetti(2);
      feedback(allRight?`${pick(PRAISE)} (${findCount}/${findCount})`:`${roundScore}개 맞았어요!`, allRight);
    }
  }
  function feedback(text,good){
    const stage=document.querySelector('#stage');
    const fb=el(`<div class="fx-text" style="margin-top:14px;font-family:'Jua';font-size:21px;color:${good?'var(--ok)':'var(--warn)'}">${text}</div>`);
    stage.appendChild(fb); setTimeout(next,1100);
  }
  next();
}

// ==========================================================
// GAME 2: 짝 맞추기 (카드 덱 딜링 애니메이션 연출 포함)
// ==========================================================
function playMemory({lv, onDone=null}={}){
  const pairs=memPairs(lv||curLevel());
  const faces=shuffle(EMOJIS).slice(0,pairs);
  const deck=shuffle([...faces,...faces]);
  let first=null,lock=true,moves=0,matched=0;
  const cols=4;
  const cw=pairs<=4?'80px':pairs<=6?'68px':'60px';
  clear();
  let cards='';
  deck.forEach((f,i)=>{
    cards+=`<div class="mcard dealing" data-i="${i}" data-f="${f}" style="opacity:0;"><div class="inner"><div class="mface mfront">?</div><div class="mface mback">${f}</div></div></div>`;
  });
  const v=el(`
    <div class="fade">
      ${stageBar()}
      <div class="scoreline">
        <span class="pill">짝 ${pairs}쌍</span>
        <span class="pill" id="stMsg" style="color:var(--memory);">🎴 카드 분배 중...</span>
        <span class="pill" id="mv">뒤집기 0</span>
      </div>
      <div class="memgrid" style="grid-template-columns:repeat(${cols},${cw});">${cards}</div>
    </div>`);
  app.appendChild(v);

  const mv=v.querySelector('#mv');
  const stMsg=v.querySelector('#stMsg');
  const cardEls=[...v.querySelectorAll('.mcard')];
  const grid=v.querySelector('.memgrid');

  // 카드 덱에서 하나씩 드랍되면서 등장하는 딜링 애니메이션 연출
  const gridRect = grid.getBoundingClientRect();
  const deckCenterX = gridRect.left + gridRect.width / 2;
  const deckCenterY = gridRect.top - 60;

  cardEls.forEach((card, idx) => {
    const cardRect = card.getBoundingClientRect();
    const cx = cardRect.left + cardRect.width / 2;
    const cy = cardRect.top + cardRect.height / 2;
    const dx = (deckCenterX - cx);
    const dy = (deckCenterY - cy);
    const rot = (Math.sin(idx) * 18).toFixed(1) + 'deg';
    card.style.setProperty('--dx', `${dx}px`);
    card.style.setProperty('--dy', `${dy}px`);
    card.style.setProperty('--drot', rot);
    card.style.animationDelay = `${idx * 75}ms`;

    setTimeout(() => {
      beep(550 + idx * 25, 0.04);
    }, idx * 75);
  });

  // 모든 카드가 딜링 완료된 후 게임 시작
  const totalDealTime = cardEls.length * 75 + 450;
  setTimeout(() => {
    cardEls.forEach(c => {
      c.classList.remove('dealing');
      c.style.opacity = '1';
    });
    lock = false;
    stMsg.textContent = '시작! 짝을 찾아보세요';
    stMsg.style.color = 'var(--ok)';
    celebrateAt(grid, { count: 8, parts: ['✨','⭐','🃏'] });
    beep(784, 0.15);
  }, totalDealTime);

  cardEls.forEach(card=>{
    card.addEventListener('click',()=>{
      if(lock||card.classList.contains('flipped')||card.classList.contains('matched')) return;
      card.classList.add('flipped'); juiceTap(card);
      if(!first){first=card;return;}
      moves++; mv.textContent='뒤집기 '+moves;
      if(first.dataset.f===card.dataset.f){
        first.classList.add('matched');card.classList.add('matched');
        beep(660);matched++;
        celebrateAt(card,{count:9});juiceTap(first);juiceTap(card);
        first=null;
        if(matched===pairs) finish();
      } else {
        lock=true; beep(220,0.12);
        const a=first,b=card;
        setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');first=null;lock=false;},850);
      }
    });
  });
  function finish(){
    const eff=Math.max(0,pairs/moves);
    const score=Math.round(Math.min(100,eff*100));
    beep(660); confetti(3);
    setTimeout(()=>{ if(onDone) onDone(score); },600);
  }
}

// GAME 3: 순서 기억
// ==========================================================
function playSeq({lv, onDone=null}={}){
  const L=lv||curLevel();
  const startLen=seqStart(L);
  const flashMs=seqFlashMs(L);
  const maxLen=startLen+7;
  const freqs=[330,392,494,587];
  const maxLives=5;
  let seq=[],level=startLen-1,lock=true,maxReached=startLen-1,lives=maxLives;
  for(let i=0;i<startLen-1;i++) seq.push(rnd(4));
  clear();
  const v=el(`
    <div class="fade">
      ${stageBar()}
      <div class="scoreline"><span class="pill" id="lv">${startLen}단계</span><span class="pill" id="lives">${'❤️'.repeat(maxLives)}</span><span class="pill" id="st">잘 보세요</span></div>
      <div class="padwrap">
        <div class="pad p0" data-p="0"></div><div class="pad p1" data-p="1"></div>
        <div class="pad p2" data-p="2"></div><div class="pad p3" data-p="3"></div>
      </div>
    </div>`);
  app.appendChild(v);
  const pads=[...v.querySelectorAll('.pad')];
  const padwrap=v.querySelector('.padwrap');
  const lvEl=v.querySelector('#lv'),stEl=v.querySelector('#st'),livesEl=v.querySelector('#lives');
  let input=[];
  pads.forEach(p=>p.addEventListener('click',()=>{
    if(lock) return;
    const i=+p.dataset.p; flashPad(i); juiceTap(p); input.push(i);
    const idx=input.length-1;
    if(input[idx]!==seq[idx]) return onMistake();
    if(input.length===seq.length){
      lock=true; maxReached=level; stEl.textContent='좋아요! 😊';
      celebrateAt(padwrap,{count:12});
      if(level>=maxLen) return gameover(true);
      setTimeout(nextLevel,850);
    }
  }));
  function flashPad(i,dur=320){ pads[i].classList.add('on'); beep(freqs[i]); setTimeout(()=>pads[i].classList.remove('on'),dur); }
  function playbackSeq(){
    lock=true;
    let k=0;
    const t=setInterval(()=>{
      if(k<seq.length){flashPad(seq[k]);k++;}
      else{clearInterval(t);lock=false;stEl.textContent='따라 누르세요';}
    },flashMs);
  }
  function nextLevel(){
    level++; lvEl.textContent=level+'단계'; stEl.textContent='잘 보세요';
    seq.push(rnd(4)); input=[];
    playbackSeq();
  }
  function onMistake(){
    lock=true;
    pads.forEach(p=>p.classList.remove('on'));
    beep(220,0.18);
    lives--;
    livesEl.textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(maxLives-Math.max(0,lives));
    if(lives<=0) return gameover();
    input=[];
    stEl.textContent=`다시 해봐요! (기회 ${lives}번 남음)`;
    setTimeout(playbackSeq,900);
  }
  function gameover(success=false){
    pads.forEach(p=>p.classList.remove('on'));
    if(!success) beep(160,0.3); else confetti(3);
    const reached=Math.max(0,maxReached-(startLen-1));
    const score=Math.round(Math.min(100,reached/8*100));
    setTimeout(()=>{ if(onDone) onDone(score); },500);
  }
  setTimeout(nextLevel,600);
}

// ==========================================================
// GAME 4: 빠른 셈
// ==========================================================
function playMath({lv, qs=10, onDone=null}={}){
  let q=0,score=0,level=lv||curLevel(); const total=qs;
  let timer=null;
  function makeProblem(){
    const big=level<=2?9:Math.min(99,level*9);
    const pool=['+']; if(level>=2) pool.push('−'); if(level>=7) pool.push('×');
    const op=pick(pool);
    let a,b,ans;
    if(op==='×'){a=rnd(8)+2;b=rnd(8)+2;ans=a*b;}
    else if(op==='−'){a=rnd(big)+2;b=rnd(a-1)+1;ans=a-b;}
    else{a=rnd(big)+1;b=rnd(big)+1;ans=a+b;}
    const opts=new Set([ans]); let guard=0;
    while(opts.size<4&&guard++<60){const d=ans+(rnd(11)-5);if(d>=0&&d!==ans)opts.add(d);}
    while(opts.size<4){opts.add(ans+opts.size+1);}
    return{text:`${a} ${op} ${b}`,ans,opts:shuffle([...opts])};
  }
  function next(){
    if(q>=total){ const finalScore=Math.round(score/total*100); return onDone?onDone(finalScore):null; }
    q++;
    const p=makeProblem();
    clear();
    const v=el(`
      <div class="fade">
        ${stageBar()}
        <div class="scoreline"><span class="pill">🔢 ${q}/${total}</span><span class="pill">맞춘 개수 ${score}</span></div>
        <div class="panel">
          <div class="qbox">${p.text} = ?</div>
          <div class="timerbar"><div class="timerfill" id="tf"></div></div>
          <div class="choices">${p.opts.map(o=>`<button class="choice" data-v="${o}">${o}</button>`).join('')}</div>
        </div>
      </div>`);
    app.appendChild(v);
    const tf=v.querySelector('#tf');
    let answered=false,t=100;
    timer=setInterval(()=>{t-=1.1;tf.style.width=Math.max(0,t)+'%';if(t<=0){clearInterval(timer);if(!answered)timeUp(p,v);}},100);
    v.querySelectorAll('.choice').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(answered) return; answered=true; clearInterval(timer);
        const val=+btn.dataset.v;
        if(val===p.ans){btn.classList.add('right');juiceTap(btn);celebrateAt(btn,{count:9});beep(660);score++;if(level<10)level++;msg(v,pick(PRAISE),true);}
        else{btn.classList.add('wrongpick');beep(220,0.12);const r=v.querySelector(`.choice[data-v="${p.ans}"]`);if(r)r.classList.add('right');if(level>1)level--;msg(v,'정답은 '+p.ans+'이에요',false);}
      });
    });
  }
  function timeUp(p,v){const r=v.querySelector(`.choice[data-v="${p.ans}"]`);if(r)r.classList.add('right');if(level>1)level--;msg(v,'정답은 '+p.ans+'이에요',false);}
  function msg(v,text,good){
    const m=el(`<div class="fx-text" style="margin-top:14px;font-family:'Jua';font-size:22px;color:${good?'var(--ok)':'var(--warn)'}">${text}</div>`);
    v.querySelector('.panel').appendChild(m); setTimeout(next,good?750:1100);
  }
  next();
}

        if(other !== item) other.classList.add('dimmed');
      });
      item.classList.remove('floating');
      item.classList.add('selected');
      const img = item.querySelector('.chest-img');
      img.src = 'assets/box-2-selected.svg';
      beep(440, 0.12); setTimeout(()=>beep(554, 0.12), 100);

      // 드롭 확률 판정: 꽝 80%, 말씀카드 15%, 머털도사 카드 5%
      const rand = Math.random();
      let outcome = 'empty';

        outcome = 'empty';
      } else if(rand < 0.95){
        outcome = 'verse';
      } else {
        outcome = 'meoteol';
      }

      // 2~5단계 상자 열림 순차 애니메이션
      await new Promise(r => setTimeout(r, 600));
      img.src = 'assets/box-3-opening-1.svg';
      beep(659, 0.14);

      await new Promise(r => setTimeout(r, 380));
      img.src = 'assets/box-4-opening-2.svg';
      beep(784, 0.16);

      await new Promise(r => setTimeout(r, 380));
      img.src = 'assets/box-5-opened.svg';
      beep(880, 0.25);

      await new Promise(r => setTimeout(r, 450));
      ov.remove();

      // 결과 화면 노출
      if(outcome === 'empty'){
        showEmptyRewardScreen();
      } else if(outcome === 'verse'){
        showVerseRewardScreen();
      } else {
        await showMeoteolRewardScreen();
      }
    });
  });
}

function spawnBurstParticles(container){
  const parts=['✨','⭐','🎊','💥','🌟'];
  for(let i=0;i<14;i++){
    const p=document.createElement('div');
    p.className='burst-particle';
    p.textContent=pick(parts);
    const angle=Math.random()*Math.PI*2;
    const dist=55+Math.random()*95;
    p.style.setProperty('--bx',(Math.cos(angle)*dist)+'px');
    p.style.setProperty('--by',(Math.sin(angle)*dist)+'px');
    p.style.fontSize=(16+Math.random()*14)+'px';
    p.style.animationDelay=(Math.random()*0.08)+'s';
    container.appendChild(p);
    setTimeout(()=>p.remove(),900);
  }
}

function showFinalResult(){
  const{domainScores}=session;
  const avg=d=>domainScores[d].length?Math.round(domainScores[d].reduce((a,b)=>a+b,0)/domainScores[d].length):0;
  const domains={
    speed:{label:'⚡ 처리속도',score:avg('speed')},
    seq:{label:'🎵 작업기억',score:avg('seq')},
    math:{label:'🔢 계산력',score:avg('math')},
    memory:{label:'🃏 기억력',score:avg('memory')},
  };
  const domainVals=Object.values(domains).map(d=>d.score);
  const totalScore=Math.round(domainVals.reduce((a,b)=>a+b,0)/domainVals.length);
  if(totalScore>(currentMember.bestTotal||0)){ currentMember.bestTotal=totalScore; }
  currentMember.scoreLog = pushCapped(currentMember.scoreLog, {
    ts:new Date().toISOString(), total:totalScore,
    speed:domains.speed.score, seq:domains.seq.score, math:domains.math.score, memory:domains.memory.score
  });
  saveMember();
  const stars=totalScore>=80?3:totalScore>=60?2:1;
  const starStr='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  if(stars===3) confetti(8); else if(stars===2) confetti(4);
  const barHtml=Object.values(domains).map(d=>`
    <div class="domain-row">
      <div class="dlabel"><span>${d.label}</span><span style="color:${scoreColor(d.score)}">${d.score}점</span></div>
      <div class="dtrack"><div class="dfill" style="width:${d.score}%;background:${scoreColor(d.score)};"></div></div>
    </div>`).join('');
  const diag=getDiagnosis(totalScore,domains);
  clear();
  const v=el(`
    <div class="fade">
      <div class="panel" style="margin-bottom:14px;">
        <div style="font-family:'Jua';font-size:24px;margin-bottom:4px;">오늘의 두뇌 운동 완료! 🏁</div>
        <div class="stars fx-text">${starStr}</div>
        <div class="fx-text" style="font-family:'Jua';font-size:58px;color:${scoreColor(totalScore)};line-height:1.1;">${totalScore}점</div>
        <div style="font-size:15px;color:var(--ink-soft);margin-top:6px;">최고 기록: ${currentMember.bestTotal}점</div>
      </div>
      <div class="panel" style="text-align:left;margin-bottom:14px;">
        <div style="font-family:'Jua';font-size:20px;margin-bottom:14px;">📊 영역별 점수</div>
        ${barHtml}
      </div>
      <div class="panel" style="text-align:left;margin-bottom:14px;">
        <div style="font-family:'Jua';font-size:20px;margin-bottom:10px;">💬 오늘의 진단</div>
        <div style="font-size:17px;line-height:1.8;color:var(--ink);">${diag}</div>
      </div>
      <button class="btn btn-primary" id="retry" style="font-size:23px;padding:19px;">다시 도전하기</button>
      <div class="btn-row" style="margin-top:10px;"><button class="btn btn-ghost" id="home">홈으로</button></div>
    </div>`);
  app.appendChild(v);
  v.querySelector('#retry').addEventListener('click',startSession);
  v.querySelector('#home').addEventListener('click',()=>renderHome());

  // 8스테이지 완료 후 3개 상자 선택 보너스 모달 팝업
  setTimeout(() => {
    showChestRewardModal();
  }, 650);
}
function getDiagnosis(total,domains){
  const entries=Object.entries(domains).sort((a,b)=>a[1].score-b[1].score);
  const weakest=entries[0], strongest=entries[entries.length-1];
  const names={speed:'처리속도',seq:'작업기억',math:'계산력',memory:'기억력'};
  const advice={
    speed:'순간 판단력과 처리속도를 높이는 훈련을 꾸준히 해보세요.',
    seq:'순서를 기억하는 작업기억 훈련에 좀 더 집중해 보시면 도움이 될 거예요.',
    math:'매일 간단한 계산 연습을 하시면 계산력이 빠르게 향상됩니다.',
    memory:'그림이나 단어를 외우는 기억력 훈련을 더 해보시면 좋겠어요.',
  };
  let lines=[];
  if(total>=85) lines.push('모든 인지 영역이 매우 우수한 수준이에요!');
  else if(total>=70) lines.push('전반적으로 양호한 수준이에요.');
  else if(total>=55) lines.push('기본적인 인지 기능은 잘 유지되고 있어요.');
  else lines.push('오늘은 조금 어려우셨나요? 천천히 꾸준히 하면 반드시 좋아져요.');
  if(strongest[1].score>=80) lines.push(`특히 ${names[strongest[0]]} 능력이 뛰어나세요!`);
  if(weakest[1].score<65) lines.push(advice[weakest[0]]);
  lines.push('매일 조금씩 꾸준히 하는 것이 두뇌 건강의 가장 좋은 방법이에요 😊');
  return lines.join('<br>');
}

  const bestHtml=currentMember.bestTotal?`<div class="streak" style="background:#E5F6F0;border-color:#A5DDD0;color:#1E8E7B;">🏆 최고 ${currentMember.bestTotal}점</div>`:'';

      done++;
      statusEl.textContent=`${done}/${files.length}장 등록 중...`;
    }
    await saveCardIndex(cardIndex);
    let msg=`완료! ${files.length-skipped}장 등록됨`;

      if(reasons.has('quota')) parts.push('저장 공간 부족 — 카드를 좀 지우고 다시 시도해주세요');
      msg += ` · 건너뜀 ${skipped}건 (${parts.join(', ')})`;
    }
    statusEl.textContent=msg;
    setTimeout(renderAdminDashboard, skipped?3200:900);
  }

  // ---- members list ----
  const memberList=v.querySelector('#memberList');
  if(!members.length){
    memberList.innerHTML='<div style="color:var(--ink-soft);font-size:14px;padding:8px 0;">아직 가입한 회원이 없어요</div>';

      </div>`);

async function exportCardsToFile(){
  const v=await stGet('bg:cards:index');
  const localOnly=v?JSON.parse(v):[];
  const bundle=[];
  for(const c of localOnly){
    const img=await getCardImage(c.id);
    if(img) bundle.push({id:c.id, name:c.name, mime:c.mime, addedAt:c.addedAt, img});
  }
  const blob=new Blob([JSON.stringify(bundle)], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='brain-game-cards.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
async function importCardsFromFile(file){
  let bundle;
  try{ bundle=JSON.parse(await file.text()); }catch(e){ return 0; }
  if(!Array.isArray(bundle)) return 0;
  cardIndex=await loadCardIndex();
  const existingIds=new Set(cardIndex.map(c=>c.id));
  let added=0;
  for(const item of bundle){
    if(!item || !item.id || !item.img || existingIds.has(item.id)) continue;
    const saved=await saveCardImage(item.id, item.img);
    if(saved){
      cardIndex.push({id:item.id, name:item.name||'이름 없음', mime:item.mime||'image/png', addedAt:item.addedAt||Date.now()});
      existingIds.add(item.id);
      added++;
    }
  }
  if(added>0) await saveCardIndex(cardIndex);
  return added;
}

function fmtBirthdate(bd){
  bd=bd||'';
  return bd.length===6? `${bd.slice(0,2)}.${bd.slice(2,4)}.${bd.slice(4,6)}` : bd;
}
async function grantCardToMember(birthdate, cardId){
  const db=initFirebase();
  if(db){
    try{
      const ref=db.collection('members').doc(birthdate);
      const snap=await ref.get();
      if(!snap.exists) return false;
      const m=snap.data();
      m.cards=m.cards||{};
      m.cards[cardId]=(m.cards[cardId]||0)+1;
      await ref.set(m, {merge:true});
      return true;
    }catch(e){ return false; }
  }
  const raw=await stGet('bg:member:'+birthdate);
  if(!raw) return false;
  const m=JSON.parse(raw);
  m.cards=m.cards||{};
  m.cards[cardId]=(m.cards[cardId]||0)+1;
  await stSet('bg:member:'+m.birthdate, JSON.stringify(m));
  return true;
}
async function showGrantCardModal(member){
  const idx=await loadCardIndex();
  const listHtml=idx.length? idx.map(c=>`
      <button class="choice-card" data-id="${c.id}" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);box-shadow:0 4px 10px rgba(0,0,0,.06);border-radius:14px;padding:8px 10px;margin-bottom:8px;cursor:pointer;">
        <span class="gc-thumb" data-id="${c.id}" style="width:44px;height:44px;border-radius:8px;background:#F5EDDC;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:20px;">🎴</span>
        <span style="font-family:'Jua';font-size:16px;">${c.name}</span>
      </button>`).join('')
    : '<div style="color:var(--ink-soft);padding:10px 0;font-size:14px;">등록된 카드가 없어요. 먼저 카드를 등록해주세요.</div>';
  const ov=el(`
    <div class="overlay">
      <div class="modal fade">
        <h2 style="font-family:'Jua';font-size:20px;margin:0 0 4px;">🎁 카드 선물하기</h2>
        <div style="font-size:14px;color:var(--ink-soft);margin-bottom:14px;">${fmtBirthdate(member.birthdate)} 회원에게 줄 카드를 선택하세요</div>
        <div style="max-height:50vh;overflow:auto;">${listHtml}</div>
        <button class="btn btn-ghost" id="closeGrant" style="margin-top:6px;">취소</button>
      </div>
    </div>`);
  document.body.appendChild(ov);
  ov.querySelector('#closeGrant').addEventListener('click',()=>ov.remove());
  idx.forEach(c=>{
    getCardImage(c.id).then(img=>{
      if(img){ const t=ov.querySelector(`.gc-thumb[data-id="${c.id}"]`); if(t) t.innerHTML=`<img src="${img}" style="width:100%;height:100%;object-fit:cover;">`; }
    });
  });
  ov.querySelectorAll('.choice-card').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const cardId=btn.dataset.id;
      await grantCardToMember(member.birthdate, cardId);
      if(currentMember && currentMember.birthdate===member.birthdate){
        currentMember.cards=currentMember.cards||{};
        currentMember.cards[cardId]=(currentMember.cards[cardId]||0)+1;
      }
      ov.remove();
      const card=idx.find(c=>c.id===cardId);
      const img=await getCardImage(cardId);
      renderAdminDashboard();
      if(card) playCardRevealEffect(card, img, {countText:`${fmtBirthdate(member.birthdate)} 회원에게 선물 완료`, headline:'카드를 선물했어요!'});
    });
  });
}

function fmtDateTime(iso){
  if(!iso) return '-';
  const d=new Date(iso);
  const days=['일','월','화','수','목','금','토'];
  const hh=d.getHours(), mm=String(d.getMinutes()).padStart(2,'0');
  const ampm=hh<12?'오전':'오후';
  const h12=hh%12===0?12:hh%12;
  return `${d.getMonth()+1}월 ${d.getDate()}일(${days[d.getDay()]}) ${ampm} ${h12}:${mm}`;
}
async function renderMemberDetail(member){
  setGameBackground(null);
  clear();
  const fmt=fmtBirthdate(member.birthdate);
  const cardCount=Object.keys(member.cards||{}).length;
  const loginLog=(member.loginLog||[]).slice().reverse();
  const scoreLog=(member.scoreLog||[]).slice().reverse();

  const loginHtml=loginLog.length? loginLog.slice(0,30).map(ts=>`
      <div style="padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;">${fmtDateTime(ts)}</div>
    `).join('') : '<div style="color:var(--ink-soft);font-size:14px;padding:8px 0;">로그인 기록이 없어요</div>';

  const scoreHtml=scoreLog.length? scoreLog.slice(0,30).map(s=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--line);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;color:var(--ink-soft);">${fmtDateTime(s.ts)}</span>
          <span style="font-family:'Jua';font-size:18px;color:${scoreColor(s.total)};">${s.total}점</span>
        </div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">⚡${s.speed} 🎵${s.seq} 🔢${s.math} 🃏${s.memory}</div>
      </div>
    `).join('') : '<div style="color:var(--ink-soft);font-size:14px;padding:8px 0;">플레이 기록이 없어요</div>';

  const v=el(`
    <div class="fade">
      <div class="topbar">
        <div class="brand" style="font-size:22px;">${fmt} 님</div>
        <button class="iconbtn" id="back">‹</button>
      </div>
      <div class="panel" style="margin-bottom:14px;text-align:left;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px;">
          <div>가입일<br><b style="font-family:'Jua';font-size:16px;">${fmtDateTime(member.joinedAt)}</b></div>
          <div>연속 일수<br><b style="font-family:'Jua';font-size:16px;">${member.streak||0}일</b></div>
          <div>최고 점수<br><b style="font-family:'Jua';font-size:16px;color:${scoreColor(member.bestTotal||0)};">${member.bestTotal||0}점</b></div>
          <div>보유 카드<br><b style="font-family:'Jua';font-size:16px;">${cardCount}종</b></div>
        </div>
      </div>
      <div class="admin-panel">
        <div class="section-title">📅 로그인 기록 (최근 ${Math.min(30,loginLog.length)}건)</div>
        <div>${loginHtml}</div>
      </div>
      <div class="admin-panel">
        <div class="section-title">📊 점수 활동 내역 (최근 ${Math.min(30,scoreLog.length)}건)</div>
        <div>${scoreHtml}</div>
      </div>
      <button class="btn btn-ghost" id="back2">닫기</button>
    </div>`);
  app.appendChild(v);
  v.querySelector('#back').addEventListener('click',renderAdminDashboard);
  v.querySelector('#back2').addEventListener('click',renderAdminDashboard);
}

async function renderAdminLibrary(){
  setGameBackground(null);
  clear();
  cardIndex = await loadCardIndex();
  const imgMap={};
  const v=el(`
    <div class="fade">
      <div class="topbar"><div class="brand">📚 카드 라이브러리</div><button class="iconbtn" id="back">‹</button></div>
      <div class="panel" style="margin-bottom:14px;">
        <div style="font-family:'Jua';font-size:20px;">등록된 카드 ${cardIndex.length}종</div>
        <div style="font-size:14px;color:var(--ink-soft);margin-top:4px;">카드를 누르면 획득 연출을 미리 볼 수 있어요<br>🔗 아이콘을 누르면 그 카드를 선물하는 링크가 복사돼요</div>
      </div>
      <div class="mycard-grid" id="grid">${cardIndex.length?'':'<div style="grid-column:1/-1;color:var(--ink-soft);padding:20px 0;">등록된 카드가 없어요</div>'}</div>
    </div>`);
  app.appendChild(v);
  v.querySelector('#back').addEventListener('click',renderAdminDashboard);
  const grid=v.querySelector('#grid');
  cardIndex.forEach(c=>{
    const item=el(`<div class="mycard-item" style="cursor:pointer;position:relative;">
      <button class="gift-link-btn" data-id="${c.id}" style="position:absolute;top:2px;right:2px;z-index:2;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:8px;width:26px;height:26px;font-size:13px;cursor:pointer;">🔗</button>
      <div class="ph">🎴</div>
      <div class="nm">${c.name}</div>
    </div>`);
    grid.appendChild(item);
    getCardImage(c.id).then(img=>{
      imgMap[c.id]=img;
      if(img){ const ph=item.querySelector('.ph'); if(ph) ph.outerHTML=`<img src="${img}">`; }
    });
    item.querySelector('.gift-link-btn').addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ok=await copyGiftLink(c.id);
      showToast(ok?'🔗 선물 링크가 복사됐어요! 카카오톡 등으로 보내주세요':'복사에 실패했어요');
    });
    item.addEventListener('click', async ()=>{
      let img=imgMap[c.id];
      if(img===undefined) img=await getCardImage(c.id);
      playCardRevealEffect(c, img, {});
    });
  });
}
