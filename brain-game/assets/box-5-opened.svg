<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="celestialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="25%" stop-color="#FFF4D0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFD166" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#FF9F43" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EE5253" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A2E28" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3A2E28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7E5F"/>
      <stop offset="50%" stop-color="#EE5A24"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="100%" stop-color="#EA5229"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="40%" stop-color="#FDCB6E"/>
      <stop offset="100%" stop-color="#E17055"/>
    </linearGradient>
    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="172" rx="65" ry="14" fill="url(#shadowG)"/>

  <!-- Inside Depth -->
  <path d="M 46 88 L 154 88 L 150 120 L 50 120 Z" fill="#380902"/>

  <!-- Dazzling Light Pillar & Starburst -->
  <circle cx="100" cy="70" r="75" fill="url(#celestialGlow)" filter="url(#hyperGlow)"/>

  <!-- Light Rays -->
  <polygon points="100,80 15,-10 35,-20" fill="#FFF" opacity="0.65" filter="url(#hyperGlow)"/>
  <polygon points="100,80 80,-30 120,-30" fill="#FFF" opacity="0.8" filter="url(#hyperGlow)"/>
  <polygon points="100,80 165,-20 185,-10" fill="#FFF" opacity="0.65" filter="url(#hyperGlow)"/>
  <polygon points="100,80 -10,30 -10,55" fill="#FFEAA7" opacity="0.5" filter="url(#hyperGlow)"/>
  <polygon points="100,80 210,30 210,55" fill="#FFEAA7" opacity="0.5" filter="url(#hyperGlow)"/>

  <!-- Starburst Sparkles -->
  <path d="M 100 20 L 105 45 L 130 50 L 105 55 L 100 80 L 95 55 L 70 50 L 95 45 Z" fill="#FFF" filter="url(#hyperGlow)"/>
  <path d="M 50 40 L 53 52 L 65 55 L 53 58 L 50 70 L 47 58 L 35 55 L 47 52 Z" fill="#FFEAA7" filter="url(#hyperGlow)"/>
  <path d="M 150 35 L 153 47 L 165 50 L 153 53 L 150 65 L 147 53 L 135 50 L 147 47 Z" fill="#FFEAA7" filter="url(#hyperGlow)"/>

  <!-- Box Body -->
  <path d="M 40 85 L 160 85 L 152 160 C 152 164 148 168 144 168 L 56 168 C 52 168 48 164 48 160 Z" fill="url(#boxGrad)" stroke="#B33922" stroke-width="3" stroke-linejoin="round"/>

  <!-- Vertical Ribbon on Body -->
  <rect x="88" y="85" width="24" height="83" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
  <line x1="100" y1="85" x2="100" y2="168" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>

  <!-- Box Lid (Fully thrown back / to the side -45deg) -->
  <g transform="translate(45, 95) rotate(-55) translate(-45, -95)">
    <rect x="-20" y="20" width="130" height="25" rx="6" fill="url(#lidGrad)" stroke="#B33922" stroke-width="3"/>
    <rect x="34" y="20" width="24" height="25" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
    <line x1="46" y1="20" x2="46" y2="45" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>

    <!-- Bow -->
    <path d="M 38 20 C 11 -6 6 -20 26 -20 C 41 -20 44 8 45 20 Z" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
    <path d="M 54 20 C 81 -6 86 -20 66 -20 C 51 -20 48 8 47 20 Z" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
    <circle cx="46" cy="18" r="9" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2.5"/>
  </g>
</svg>
