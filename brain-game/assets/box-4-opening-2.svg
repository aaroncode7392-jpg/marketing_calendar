<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="strongLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FFFDF0" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#FFEAA7" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#FDCB6E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E17055" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A2E28" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3A2E28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7E5F"/>
      <stop offset="50%" stop-color="#EE5A24"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="100%" stop-color="#EA5229"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="40%" stop-color="#FDCB6E"/>
      <stop offset="100%" stop-color="#E17055"/>
    </linearGradient>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="172" rx="65" ry="14" fill="url(#shadowG)"/>

  <!-- Inside Depth -->
  <path d="M 46 88 L 154 88 L 150 120 L 50 120 Z" fill="#4B0F05"/>

  <!-- Light Beam Bursting Upwards -->
  <polygon points="50,85 20,20 180,20 150,85" fill="url(#strongLight)" opacity="0.85" filter="url(#bigGlow)"/>
  <polygon points="75,85 50,0 150,0 125,85" fill="#FFF" opacity="0.7" filter="url(#bigGlow)"/>

  <!-- Sparkles -->
  <circle cx="80" cy="45" r="4" fill="#FFF" filter="url(#bigGlow)"/>
  <circle cx="125" cy="38" r="5" fill="#FFF" filter="url(#bigGlow)"/>
  <circle cx="100" cy="25" r="6" fill="#FFF" filter="url(#bigGlow)"/>

  <!-- Box Body -->
  <path d="M 40 85 L 160 85 L 152 160 C 152 164 148 168 144 168 L 56 168 C 52 168 48 164 48 160 Z" fill="url(#boxGrad)" stroke="#B33922" stroke-width="3" stroke-linejoin="round"/>

  <!-- Vertical Ribbon on Body -->
  <rect x="88" y="85" width="24" height="83" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
  <line x1="100" y1="85" x2="100" y2="168" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>

  <!-- Box Lid (Tilted back -24deg) -->
  <g transform="translate(100, 75) rotate(-24) translate(-100, -75)">
    <rect x="34" y="32" width="132" height="25" rx="6" fill="url(#lidGrad)" stroke="#B33922" stroke-width="3"/>
    <rect x="88" y="32" width="24" height="25" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
    <line x1="100" y1="32" x2="100" y2="57" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>

    <!-- Bow -->
    <path d="M 92 32 C 65 6 60 -8 80 -8 C 95 -8 98 20 99 32 Z" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
    <path d="M 108 32 C 135 6 140 -8 120 -8 C 105 -8 102 20 101 32 Z" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
    <circle cx="100" cy="30" r="9" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2.5"/>
    <circle cx="98" cy="28" r="3" fill="#FFF" opacity="0.7"/>
  </g>
</svg>
