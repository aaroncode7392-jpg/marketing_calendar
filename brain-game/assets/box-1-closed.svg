<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A2E28" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3A2E28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7E5F"/>
      <stop offset="50%" stop-color="#EE5A24"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C23616"/>
      <stop offset="100%" stop-color="#A5280E"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="100%" stop-color="#EA5229"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="40%" stop-color="#FDCB6E"/>
      <stop offset="100%" stop-color="#E17055"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="172" rx="65" ry="14" fill="url(#shadowG)"/>

  <!-- Box Body -->
  <path d="M 40 85 L 160 85 L 152 160 C 152 164 148 168 144 168 L 56 168 C 52 168 48 164 48 160 Z" fill="url(#boxGrad)" stroke="#B33922" stroke-width="3" stroke-linejoin="round"/>
  <!-- Box Side highlight/shading -->
  <path d="M 40 85 L 60 85 L 64 168 L 56 168 C 52 168 48 164 48 160 Z" fill="#FFA07A" opacity="0.25"/>

  <!-- Vertical Ribbon on Body -->
  <rect x="88" y="85" width="24" height="83" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
  <line x1="100" y1="85" x2="100" y2="168" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>

  <!-- Box Lid (Closed) -->
  <g id="lidGroup">
    <rect x="34" y="68" width="132" height="25" rx="6" fill="url(#lidGrad)" stroke="#B33922" stroke-width="3" filter="url(#softGlow)"/>
    <!-- Horizontal Ribbon on Lid -->
    <rect x="88" y="68" width="24" height="25" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
    <line x1="100" y1="68" x2="100" y2="93" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>

    <!-- Ribbon Bow Top -->
    <!-- Left Loop -->
    <path d="M 92 68 C 65 42 60 28 80 28 C 95 28 98 56 99 68 Z" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
    <!-- Right Loop -->
    <path d="M 108 68 C 135 42 140 28 120 28 C 105 28 102 56 101 68 Z" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2"/>
    <!-- Ribbon Center Knot -->
    <circle cx="100" cy="66" r="9" fill="url(#ribbonGold)" stroke="#D48A18" stroke-width="2.5"/>
    <circle cx="98" cy="64" r="3" fill="#FFF" opacity="0.7"/>
  </g>
</svg>
